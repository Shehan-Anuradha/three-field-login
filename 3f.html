<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Three-Field Login Demo</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(circle at 20% 0%, #223e70, transparent 42%), linear-gradient(130deg,#0a1020,#111d35); color: #edf3ff; }
    .card { width: min(100%, 410px); padding: 36px; background: rgba(20, 32, 53, .94); border: 1px solid #344563; border-radius: 20px; box-shadow: 0 24px 70px #0006; }
    .symbol { width: 48px; height: 48px; display:grid;place-items:center; background:#3163df; border-radius: 13px; font-size:24px; margin-bottom:20px; }
    h1 { margin:0 0 8px; font-size: 26px; }
    p { color: #aabbd4; line-height:1.5; margin: 0 0 25px; }
    label { display:block; margin:0 0 8px; font-weight:600; font-size:14px; }
    input { width:100%; padding:13px 14px; margin-bottom:20px; border-radius:10px; border:1px solid #465775; background:#101b2f; color:#fff; font:inherit; outline:none; }
    input:focus { border-color:#75a4ff; box-shadow:0 0 0 3px #4175e340; }
    button { width:100%; border:0; padding:14px; border-radius:10px; background:#477bf0; color:white; font:inherit; font-weight:700; cursor:pointer; }
    button:hover { background:#6594ff; }
    .message { min-height:22px; margin:16px 0 0; font-size:14px; }
    .error { color:#ff9b9b; }
    .success { color:#7fe0b0; }
    .hint { margin-top:22px; padding-top:18px; border-top:1px solid #344563; font-size:12px; color:#9bacc7; line-height:1.5; }
    code { color:#dce8ff; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main class="card">
    <section id="login-view">
      <div class="symbol" aria-hidden="true">🔐</div>
      <h1>Secure Portal Demo</h1>
      <p>Enter all three fields to continue.</p>
      <form id="login-form" autocomplete="off">
        <label for="user-id">User ID</label>
        <input id="user-id" name="user-id" type="text" placeholder="Enter user ID" required autocomplete="off" />
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Enter username" required autocomplete="off" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter password" required autocomplete="off" />
        <button type="submit">Sign In</button>
        <div id="message" class="message" role="status" aria-live="polite"></div>
      </form>
      <div class="hint">Test-only website. Credentials are checked in this page's JavaScript and can be viewed by anyone. Do not use real passwords.</div>
    </section>
    <section id="dashboard-view" hidden>
      <div class="symbol" aria-hidden="true">✓</div>
      <h1>Login successful</h1>
      <p id="welcome"></p>
      <p class="success">You have reached the demonstration dashboard.</p>
      <button id="logout" type="button">Log Out</button>
    </section>
  </main>
  <script>
    // DEMO ONLY: GitHub Pages hosts static files. These credentials are publicly visible in page source.
    const demoAccount = { userId: '1001', username: 'testuser', password: 'Test@123' };
    const form = document.getElementById('login-form');
    const message = document.getElementById('message');
    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard-view');
    const welcome = document.getElementById('welcome');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const id = document.getElementById('user-id').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (id === demoAccount.userId && username === demoAccount.username && password === demoAccount.password) {
        message.textContent = '';
        welcome.textContent = `Welcome, ${demoAccount.username} (User ID: ${demoAccount.userId}).`;
        loginView.hidden = true;
        dashboardView.hidden = false;
      } else {
        message.className = 'message error';
        message.textContent = 'Invalid User ID, username, or password.';
        document.getElementById('password').value = '';
      }
    });
    document.getElementById('logout').addEventListener('click', () => {
      form.reset();
      dashboardView.hidden = true;
      loginView.hidden = false;
      document.getElementById('user-id').focus();
    });
  </script>
</body>
</html>
