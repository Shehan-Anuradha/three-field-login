<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liquid Glass Login</title>
  <style>
    :root {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      /* Updated to Skyblue and White liquid gradient */
      background: linear-gradient(-45deg, #87CEEB, #FFFFFF, #87CEEB, #F0F8FF);
      background-size: 400% 400%;
      animation: liquidGradient 15s ease infinite;
      padding: 20px;
      color: #1e293b; /* Changed to dark text for readability on light background */
    }

    @keyframes liquidGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glassmorphism Card Effect - Adjusted for light mode */
    .glass-card {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .symbol {
      font-size: 32px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0 0 25px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      opacity: 0.9;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.5);
      color: #1e293b;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    input::placeholder {
      color: rgba(30, 41, 59, 0.6);
    }

    input:focus {
      background: rgba(255, 255, 255, 0.8);
      border-color: #87CEEB;
      box-shadow: 0 0 15px rgba(135, 206, 235, 0.5);
    }

    button {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: #87CEEB; /* Skyblue button */
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      margin-top: 10px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    button:hover {
      background: #73b8d3;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
      font-weight: 500;
    }

    .error {
      color: #dc2626; /* Darker red for light mode */
    }

    .success {
      font-size: 20px;
      font-weight: 600;
      margin: 30px 0;
      color: #059669; /* Darker green for light mode */
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <!-- LOGIN VIEW -->
    <div id="login-view">
      <div class="symbol">☁️</div>
      <h2>Liquid Portal</h2>
      <form id="login-form">
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" required autocomplete="off">
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required autocomplete="off">
        </div>
        <button type="submit">Sign In</button>
        <div id="error-msg" class="message error"></div>
      </form>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboard-view" class="hidden">
      <div class="symbol">✨</div>
      <h2>Access Granted</h2>
      <div id="welcome-msg" class="success"></div>
      <button id="logout-btn">Log Out</button>
    </div>
  </div>

  <script>
    /* 
      Passwords are obfuscated via Base64 encoding so they are not stored 
      in plain text. 
      user1#123 -> dXNlcjEjMTIz
      user2#123 -> dXNlcjIjMTIz
      user3#123 -> dXNlcjMjMTIz
    */
    const secureStore = {
      'user1': 'dXNlcjEjMTIz',
      'user2': 'dXNlcjIjMTIz',
      'user3': 'dXNlcjMjMTIz'
    };

    const form = document.getElementById('login-form');
    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard-view');
    const errorMsg = document.getElementById('error-msg');
    const welcomeMsg = document.getElementById('welcome-msg');
    const logoutBtn = document.getElementById('logout-btn');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;

      // Encode the entered password to safely compare it against the stored string
      const encodedPass = btoa(pass);

      // Verify credentials
      if (secureStore[user] && secureStore[user] === encodedPass) {
        errorMsg.textContent = '';
        welcomeMsg.textContent = `Welcome ${user}`;
        
        loginView.classList.add('hidden');
        dashboardView.classList.remove('hidden');
      } else {
        errorMsg.textContent = 'Invalid username or password.';
        document.getElementById('password').value = '';
      }
    });

    logoutBtn.addEventListener('click', () => {
      form.reset();
      dashboardView.classList.add('hidden');
      loginView.classList.remove('hidden');
      document.getElementById('username').focus();
    });
  </script>
</body>
</html>
